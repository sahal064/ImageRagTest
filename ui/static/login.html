<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PinSearch — Login</title>
  <style>
    :root {
      --red:        #e60023;
      --red-hover:  #c0001e;
      --plum:       #211922;
      --olive:      #62625b;
      --silver:     #91918c;
      --sand:       #e5e5e0;
      --warm-light: #e0e0d9;
      --fog:        #f6f6f3;
      --white:      #ffffff;
      --focus:      #435ee5;
      --grad-a: #e60023;
      --grad-b: #cf30aa;
      --grad-c: #402fb5;
      --font: 'Pin Sans', -apple-system, system-ui, 'Segoe UI', Roboto,
              'Oxygen-Sans', 'Apple Color Emoji', 'Segoe UI Emoji',
              'Helvetica Neue', Helvetica, Arial, sans-serif;
      --r-btn:  16px;
      --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: linear-gradient(135deg, #1a0a1a 0%, #0a0508 50%, #1a0a1a 100%);
      color: var(--plum);
      font-family: var(--font);
      font-size: 16px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .login-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .logo-mark {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--red) 0%, #ff3b6e 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      font-size: 36px;
      font-weight: 800;
      line-height: 1;
      user-select: none;
      box-shadow: 0 8px 24px rgba(230, 0, 35, 0.35);
    }

    .login-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--white);
      letter-spacing: -0.5px;
    }

    .login-subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.3px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .form-input {
      width: 100%;
      height: 46px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--r-btn);
      color: var(--white);
      font-family: var(--font);
      font-size: 14px;
      padding: 0 16px;
      outline: none;
      transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
    }

    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .form-input:hover {
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.1);
    }

    .form-input:focus {
      border-color: var(--grad-a);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 16px rgba(230, 0, 35, 0.2);
    }

    .login-btn {
      height: 46px;
      background: linear-gradient(135deg, var(--red) 0%, #ff2363 100%);
      border: none;
      border-radius: var(--r-btn);
      color: #fff;
      cursor: pointer;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      transition: transform 0.2s var(--ease-out-expo),
                  box-shadow 0.25s var(--ease-out-expo),
                  filter 0.2s;
      box-shadow: 0 8px 20px rgba(230, 0, 35, 0.35);
    }

    .login-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(230, 0, 35, 0.45);
      filter: brightness(1.08);
    }

    .login-btn:active:not(:disabled) {
      transform: translateY(-1px);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-message {
      display: none;
      padding: 12px 16px;
      background: rgba(255, 100, 100, 0.1);
      border: 1px solid rgba(255, 100, 100, 0.3);
      border-radius: 8px;
      color: #ff9999;
      font-size: 13px;
      text-align: center;
    }

    .error-message.show {
      display: block;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .loading {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: var(--white);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
    }

    .login-btn.loading-state .loading {
      display: block;
    }

    .login-btn.loading-state {
      position: relative;
      pointer-events: none;
    }

    @keyframes spin {
      to { transform: translateY(-50%) rotate(360deg); }
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 16px;
        gap: 24px;
      }

      .login-title {
        font-size: 24px;
      }

      .logo-mark {
        width: 56px;
        height: 56px;
        font-size: 32px;
      }
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <div class="logo-mark">P</div>
    <div>
      <h1 class="login-title">PinSearch</h1>
      <p class="login-subtitle">Image Search + Reasoning</p>
    </div>
  </div>

  <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
    <div id="errorMessage" class="error-message"></div>

    <div class="form-group">
      <label for="username" class="form-label">Username</label>
      <input
        id="username"
        type="text"
        class="form-input"
        placeholder="Enter your username"
        autocomplete="username"
        required
      />
    </div>

    <div class="form-group">
      <label for="password" class="form-label">Password</label>
      <input
        id="password"
        type="password"
        class="form-input"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      />
    </div>

    <button type="submit" class="login-btn" id="loginBtn">
      Sign In
      <div class="loading"></div>
    </button>
  </form>
</div>

<script>
  async function handleLogin(e) {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const loginBtn = document.getElementById('loginBtn');
    const errorDiv = document.getElementById('errorMessage');

    errorDiv.classList.remove('show');

    if (!username || !password) {
      showError('Please enter both username and password');
      return;
    }

    loginBtn.classList.add('loading-state');
    loginBtn.disabled = true;

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });

      const data = await res.json();

      if (res.ok) {
        localStorage.setItem('access_token', data.access_token);
        window.location.href = '/';
      } else {
        showError(data.detail || 'Invalid credentials');
      }
    } catch (err) {
      showError('Login failed. Please try again.');
    } finally {
      loginBtn.classList.remove('loading-state');
      loginBtn.disabled = false;
    }
  }

  function showError(message) {
    const errorDiv = document.getElementById('errorMessage');
    errorDiv.textContent = message;
    errorDiv.classList.add('show');
  }

  document.getElementById('username').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('password').focus();
  });

  document.getElementById('password').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('loginForm').dispatchEvent(new Event('submit'));
  });
</script>

</body>
</html>
